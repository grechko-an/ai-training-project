# ===========================================
# Regression Tests - Full Suite Pipeline
# ===========================================
# Runs the complete test suite across all browsers
# Triggered on schedule (nightly) or manual dispatch
# Generates comprehensive Allure report
# ===========================================

name: Regression Tests

on:
  schedule:
    # Run daily at 2:00 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment (dev, staging, prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      browsers:
        description: 'Browsers to run (comma-separated: chromium,firefox,webkit)'
        required: false
        default: 'chromium,firefox,webkit'
        type: string

# ===========================================
# Environment Variables
# ===========================================
env:
  CI: 'true'
  NODE_VERSION: '20'
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}
  BASE_URL: ${{ secrets.BASE_URL || 'https://staging.example.com' }}
  API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://staging.example.com/api' }}
  AUTH_TOKEN: ${{ secrets.AUTH_TOKEN || '' }}
  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'password' }}
  TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME || 'testuser' }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'testpass' }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || '' }}

# ===========================================
# Jobs
# ===========================================
jobs:
  # --------------------------------------------------
  # Job 1: Lint and Type Check
  # --------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint
        continue-on-error: true

  # --------------------------------------------------
  # Job 2: Run Regression Tests (Matrix Strategy)
  # --------------------------------------------------
  regression:
    name: Regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Create test results directories
        run: |
          mkdir -p test-results/screenshots
          mkdir -p test-results/videos
          mkdir -p test-results/traces
          mkdir -p tests/reports/allure-results
          mkdir -p tests/reports/html
          mkdir -p tests/reports/junit
          mkdir -p tests/reports/json

      - name: Run full regression tests (${{ matrix.browser }})
        id: run-regression
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --grep @regression \
            --reporter=html,junit,allure-playwright,list,json
        continue-on-error: true
        env:
          CI: 'true'
          ENV: ${{ env.TEST_ENV }}

      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate ./tests/reports/allure-results \
            --clean \
            -o ./tests/reports/allure-report \
            || echo "Allure report generation skipped (no results)"
        continue-on-error: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-html-report-${{ matrix.browser }}
          path: tests/reports/html/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-junit-report-${{ matrix.browser }}
          path: tests/reports/junit/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-report-${{ matrix.browser }}
          path: tests/reports/allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-results-${{ matrix.browser }}
          path: tests/reports/allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-json-report-${{ matrix.browser }}
          path: tests/reports/json/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

  # --------------------------------------------------
  # Job 3: Aggregate Allure Reports
  # --------------------------------------------------
  aggregate-allure:
    name: Aggregate Allure Report
    runs-on: ubuntu-latest
    needs: regression
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: regression-allure-results-*
          path: ./downloaded-allure-results/
          merge-multiple: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Allure CLI
        run: npm install -g allure-commandline || echo "Using npx allure"

      - name: Generate comprehensive Allure report
        run: |
          mkdir -p ./aggregated-reports/allure-report
          if [ -d "./downloaded-allure-results" ] && [ "$(ls -A ./downloaded-allure-results)" ]; then
            npx allure generate ./downloaded-allure-results \
              --clean \
              -o ./aggregated-reports/allure-report
            echo "Comprehensive Allure report generated"
          else
            echo "No Allure results to aggregate"
          fi
        continue-on-error: true

      - name: Upload comprehensive Allure report
        uses: actions/upload-artifact@v4
        with:
          name: regression-comprehensive-allure-report
          path: ./aggregated-reports/allure-report/
          retention-days: 30
          if-no-files-found: warn

  # --------------------------------------------------
  # Job 4: Generate Test Summary
  # --------------------------------------------------
  test-summary:
    name: Generate Test Summary
    runs-on: ubuntu-latest
    needs: regression
    if: always()
    timeout-minutes: 5

    steps:
      - name: Download all JUnit reports
        uses: actions/download-artifact@v4
        with:
          pattern: regression-junit-report-*
          path: ./downloaded-junit-reports/
          merge-multiple: true

      - name: Generate test summary
        run: |
          echo "## Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

          for browser in chromium firefox webkit; do
            if [ -f "./downloaded-junit-reports/junit.xml" ]; then
              echo "| $browser | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $browser | ⚠️ No report |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.TEST_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------
  # Job 5: Slack Notification
  # --------------------------------------------------
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [regression, aggregate-allure]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check Slack webhook configured
        id: check-slack
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "slack_configured=true" >> $GITHUB_OUTPUT
          else
            echo "slack_configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.regression.result }}" == "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: steps.check-slack.outputs.slack_configured == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "channel": "#test-automation",
              "username": "Regression Test Bot",
              "icon_emoji": ":test_tube:",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "title": "${{ steps.status.outputs.emoji }} Regression Tests ${{ steps.status.outputs.status }}",
                  "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Environment",
                      "value": "${{ env.TEST_ENV }}",
                      "short": true
                    },
                    {
                      "title": "Browsers",
                      "value": "Chromium, Firefox, WebKit",
                      "short": true
                    },
                    {
                      "title": "Trigger",
                      "value": "${{ github.event_name == 'schedule' && 'Nightly Schedule' || 'Manual Dispatch' }}",
                      "short": true
                    }
                  ],
                  "footer": "Regression Test Suite",
                  "ts": "${{ github.run_id }}"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}